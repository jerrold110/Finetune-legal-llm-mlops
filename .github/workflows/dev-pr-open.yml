    #             "name": "mysql-debug3",
    #             "image": "mysql:8.4",
    #             "command": ["bash", "-c", "ls -ld /var/run/mysqld; touch /var/run/mysqld/test && echo WRITE_OK || echo WRITE_FAILED; sleep 5"],
    #             "volumeMounts": [{"name": "data", "mountPath": "/var/lib/mysql"}]
    #           }],
    #           "volumes": [{"name": "data", "persistentVolumeClaim": {"claimName": "mlrun-db-pvc"}}]
    #         }
    #       }'

    #     kubectl wait --for=condition=Ready=false pod/mysql-debug3 -n mlrun --timeout=30s 2>/dev/null || true
    #     sleep 3
    #     kubectl logs -n mlrun mysql-debug3
    #     kubectl delete pod -n mlrun mysql-debug3 --ignore-not-found=true

    - name: List MLRun Pods & Services
      if: always()
      run: |
        echo "=== All services ==="
        kubectl get svc -n mlrun

        echo "=== ALL POD STATUSES ==="
        kubectl get pods -n mlrun

        echo "=== ALL PVC ==="
        kubectl get pvc -n mlrun

    - name: Debug Stuck Pods and Services
      if: always()
      run: |
        set +e

        DB_POD=$(kubectl -n mlrun get pods \
          -o name | grep '^pod/mlrun-db-' | head -n 1 | sed 's|pod/||')

        if [ -z "$DB_POD" ]; then
          echo "MLRun DB pod not found."
          exit 0
        fi

        echo "DB Pod: $DB_POD"

        echo "=== DB Image ==="
        kubectl -n mlrun get pod "$DB_POD" \
          -o jsonpath='{range .spec.containers[*]}{.name}{" -> "}{.image}{"\n"}{end}'

        echo "=== DB Image ID ==="
        kubectl -n mlrun get pod "$DB_POD" \
          -o jsonpath='{range .status.containerStatuses[*]}{.name}{" -> "}{.imageID}{"\n"}{end}'

        echo "=== DB Pod YAML ==="
        kubectl -n mlrun get pod "$DB_POD" \
          -o yaml || true

        echo "=== DB Pod Description ==="
        kubectl -n mlrun describe pod "$DB_POD" || true

        echo "=== Current DB Logs ==="
        kubectl -n mlrun logs "$DB_POD" \
          --all-containers=true \
          --tail=-1 || true

        echo "=== Previous DB Logs ==="
        kubectl -n mlrun logs "$DB_POD" \
          --all-containers=true \
          --previous \
          --tail=-1 || true

