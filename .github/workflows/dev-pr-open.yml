name: CI Pipeline

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
      - 'diagram/**'
      - 'docs/**'
  pull_request:
    branches:
      - dev

jobs:
  ci-test:
    runs-on: ubuntu-latest

    # Environment variables for this job
    env:
      # Variables
      AWS_REGION: "us-east-1"
      ENV: "dev-ci"
      long_image_tag: ${{ github.sha }}

      # Secrets
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      TF_VAR_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MLRUN_AWS_ROLE_ARN: ${{ secrets.MLRUN_AWS_ROLE_ARN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        uv pip sync requirements_ci.txt
    - name: Lint Python with flake8
      run: |
        # stop the build if there are errors
        flake8 src/ setup/ images/
    - name: Setup Terraform CLI 1.16.2
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.2"
    # - name: Setup TF project, validate and format
    #   run: |
    #     terraform -chdir=Terraform/ init \
    #       -backend-config="backend/dev-ci.hcl"

      

