name: CI Pipeline

on:
  # Branch protection rules prevent push to protected branches (dev, main, staging)
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'README.md'
      - 'diagram/**'
      - 'docs/**'

jobs:
  ci-build-and-test:
    runs-on: ubuntu-latest

    # Environment variables for this job
    env:
      # Variables
      AWS_REGION: "us-east-1"
      ENV: "dev-ci"
      IMAGE_TAG: pr-${{ github.event.pull_request.number }} #${{ github.sha }}
      TF_VAR_IMAGE_TAG: pr-${{ github.event.pull_request.number }}

      # Secrets (used more than once)
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        uv pip sync --system requirements_ci.txt
    # - name: Lint Python with flake8
    #   run: |
    #     # stop the build if there are errors
    #     flake8 src/ setup/ images/
    - name: Setup AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    # - name: Setup Terraform CLI 1.16.2
    #   uses: hashicorp/setup-terraform@v3
    #   with:
    #     terraform_version: "1.16.2"
    # - name: Setup TF project with S3 backend
    #   run: |
    #     terraform -chdir=Terraform/ init \
    #       -backend-config="backend/dev-ci.hcl"
    # - name: Validate and format Terraform
    #   run: |
    #     cd Terraform
    #     terraform validate
    #     terraform fmt
    # - name: Download lambda appconfig layer
    #   run: |
    #     cd ./images/lambda_gateway
    #     chmod +x download_appconfig_layer.sh
    #     ./download_appconfig_layer.sh
    # - name: Build docker images
    #   run: |
    #     chmod +x ./images/build_ecr.sh
    #     ./images/build_ecr.sh
    - name: Setup Kubernetes ECR Secret file
      run: |
        cat <<EOF > ./k8s/credentials
        [default]
        aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        region=${{ env.AWS_REGION }}
        EOF
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.10.0
    - name: Install MLRun via Helm
      run: |
        chmod +x ./k8s/install.sh
        ./k8s/install.sh
        rm ./k8s/credentials
    - name: Debug Stuck Pods and Services
      if: always()
      run: |
        echo "=== ALL PODS ==="
        kubectl get pods -n mlrun

        echo "=== MLRUN-DB CURRENT LOGS ==="
        kubectl logs -n mlrun deploy/mlrun-db --all-containers=true --tail=200 || true

        echo "=== MLRUN-DB PREVIOUS (CRASHED) LOGS ==="
        kubectl logs -n mlrun deploy/mlrun-db -c mlrun-db --previous --tail=200 || true

        echo "=== MLRUN-DB INIT CONTAINER LOGS ==="
        kubectl logs -n mlrun deploy/mlrun-db -c init-mysql --tail=100 || true

        echo "=== MLRUN-DB DESCRIBE ==="
        kubectl describe pod -n mlrun -l app.kubernetes.io/name=mlrun-db || \
          kubectl describe pod -n mlrun $(kubectl get pod -n mlrun -o name | grep mlrun-db)

        echo "=== EXIT CODES ==="
        kubectl get pods -n mlrun -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}  {.name} exit={.lastState.terminated.exitCode} reason={.lastState.terminated.reason}{"\n"}{end}{end}'

        echo "=== MLRUN-API PREVIOUS LOGS ==="
        kubectl logs -n mlrun deploy/mlrun-api-chief -c mlrun-api --previous --tail=200 || true

        echo "=== NODE / DISK ==="
        kubectl describe node | sed -n '/Allocated resources/,/Events/p'
        df -h
        docker exec chart-testing-control-plane df -h || true
        
