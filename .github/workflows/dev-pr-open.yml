name: CI Pipeline

on:
  # Branch protection rules prevent push to protected branches
  # push:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'README.md'
      - 'diagram/**'
      - 'docs/**'

jobs:
  ci-build-test:
    runs-on: ubuntu-latest

    # Environment variables for this job
    env:
      # Variables
      AWS_REGION: "us-east-1"
      ENV: "dev-ci"
      IMAGE_TAG: pr-${{ github.event.pull_request.number }} #${{ github.sha }}

      # Secrets (used more than once)
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        uv pip sync --system requirements_ci.txt
    - name: Lint Python with flake8
      run: |
        # stop the build if there are errors
        flake8 src/ setup/ images/
    - name: Setup AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform CLI 1.16.2
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.2"
    - name: Setup TF project with S3 backend
      run: |
        terraform -chdir=Terraform/ init \
          -backend-config="backend/dev-ci.hcl"
    - name: Validate and format Terraform
      run: |
        cd Terraform
        terraform validate
        terraform fmt
    - name: Download lambda appconfig layer
      run: |
        cd ./images/lambda_gateway
        chmod +x download_appconfig_layer.sh
        ./download_appconfig_layer.sh
    - name: Build docker images
      run: |
        chmod +x ./images/build_ecr.sh
        ./images/build_ecr.sh

      

