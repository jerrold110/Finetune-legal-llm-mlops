name: CI Pipeline

on:
  # Branch protection rules prevent push to protected branches (dev, main, staging)
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'README.md'
      - 'diagram/**'
      - 'docs/**'

jobs:
  ci-build-and-test:
    runs-on: ubuntu-latest

    # Environment variables for this job
    env:
      # Variables
      AWS_REGION: "us-east-1"
      ENV: "dev-ci"
      IMAGE_TAG: pr-${{ github.event.pull_request.number }} #${{ github.sha }}
      TF_VAR_IMAGE_TAG: pr-${{ github.event.pull_request.number }}

      # Secrets (used more than once)
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Start Minikube
      uses: medyagh/setup-minikube@latest
      with:
        cpus: max
        memory: max
    - name: Create mlrun namespace
      run: kubectl create namespace mlrun
    - name: Verify Cluster
      run: |
        kubectl cluster-info
        kubectl get nodes
        minikube ip
    # - name: Set up Helm
    #   uses: azure/setup-helm@v4
    #   with:
    #     version: 'v4.1.4'
    - name: Verify Helm version
      run: helm version
    - name: Setup Kubernetes ECR Secret file
      run: |
        cat <<EOF > ./k8s/credentials
        [default]
        aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        region=${{ env.AWS_REGION }}
        EOF
    - name: Install MLRun via Helm
      run: |
        chmod +x ./k8s/install.sh
        ./k8s/install.sh
        rm ./k8s/credentials
    - name: Inspect Kubernetes environment and MLRun DB
      if: always()
      run: |
        echo "=== Kubernetes version ==="
        kubectl version

        echo "=== Node OS, kernel and runtime ==="
        kubectl get nodes -o wide

        echo "=== MySQL image actually running ==="
        kubectl -n mlrun get pods \
          -l app.kubernetes.io/component=db \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}{.image}{"\n"}{.imageID}{"\n"}{end}{end}'

        echo
        echo "=== DB storage ==="
        kubectl -n mlrun get pvc mlrun-db-pvc -o wide
        

