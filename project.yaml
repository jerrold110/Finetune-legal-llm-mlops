kind: project
metadata:
  name: finetune-legal-extractor
spec:
  description: A fine-tuned legal extractor LLM
  functions:
  - url: src/register_raw_dataset.py
    name: raw-data-register-function
    kind: job
    image: mlrun/mlrun
    handler: register_process_raw_data
  workflows:
  - path: src/workflow_register_raw_datasets.py
    name: register_raw_datasets
  artifacts: []
  conda: ''
  source: git://github.com/jerrold110/Finetune-legal-llm-mlops.git#refs/heads/main
  origin_url: git://github.com/jerrold110/Finetune-legal-llm-mlops.git#refs/heads/main
  desired_state: online
  build:
    commands: []
    requirements: []
  custom_packagers: []
